<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; }
  body { font: 13px/1.45 -apple-system, "Segoe UI", Roboto, sans-serif;
         background: #0f1115; color: #e5e7eb; padding: 14px; }
  h1 { font-size: 15px; margin-bottom: 12px; color: #60a5fa; }
  section { background: #161a22; border: 1px solid #262c3a; border-radius: 8px;
            padding: 10px 12px; margin-bottom: 12px; }
  label { display: block; font-size: 11px; color: #9ca3af; margin-bottom: 4px;
          text-transform: uppercase; letter-spacing: .5px; }
  textarea, input { width: 100%; background: #0d1017; color: #e5e7eb;
      border: 1px solid #2d3442; border-radius: 6px; padding: 8px;
      font: inherit; resize: vertical; }
  textarea:focus, input:focus { outline: none; border-color: #3b82f6; }
  .row { display: flex; gap: 8px; }
  .row > div { flex: 1; }
  button { width: 100%; padding: 9px; border: 0; border-radius: 6px;
           font: inherit; font-weight: 600; cursor: pointer; }
  #start { background: #2563eb; color: #fff; }
  #start:hover { background: #1d4ed8; }
  #stop { background: #374151; color: #e5e7eb; margin-top: 6px; display: none; }
  #stop:hover { background: #4b5563; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  .calib { display: flex; align-items: center; gap: 8px; font-size: 12px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .dot.ok { background: #22c55e; } .dot.no { background: #f59e0b; }
  .hint { color: #9ca3af; font-size: 11px; margin-top: 4px; }
  #log { background: #0a0c10; border: 1px solid #262c3a; border-radius: 6px;
         height: 180px; overflow-y: auto; padding: 8px; font-family: Consolas,
         monospace; font-size: 11px; white-space: pre-wrap; }
  .l-ok { color: #4ade80; } .l-err { color: #f87171; }
  .l-warn { color: #fbbf24; } .l-info { color: #93c5fd; }
  #progress { color: #9ca3af; font-size: 11px; text-align: center; margin-top: 6px; }
</style>
</head>
<body>
<h1>FB AutoPost</h1>

<section>
  <div class="calib">
    <span class="dot no" id="calibDot"></span>
    <span id="calibText">Sem calibração</span>
  </div>
  <div class="hint">Poste manualmente num grupo do Facebook uma vez — a extensão aprende o formato da requisição sozinha.</div>
</section>

<section>
  <label>Grupos (URL ou slug — um por linha)</label>
  <textarea id="groups" rows="5" placeholder="https://www.facebook.com/groups/123456&#10;meugrupo.exemplo"></textarea>
</section>

<section>
  <label>Mensagem</label>
  <textarea id="message" rows="4" placeholder="Texto da publicação..."></textarea>
</section>

<section>
  <div class="row">
    <div><label>Delay mín (s)</label><input id="dmin" type="number" value="60" min="5"></div>
    <div><label>Delay máx (s)</label><input id="dmax" type="number" value="180" min="5"></div>
  </div>
  <div class="hint">Intervalo aleatório entre postagens — imita comportamento humano.</div>
</section>

<button id="start">Iniciar postagens</button>
<button id="stop">Parar</button>
<div id="progress"></div>

<section style="margin-top:12px">
  <label>Log</label>
  <div id="log"></div>
</section>

<script src="sidepanel.js"></script>
</body>
</html>
