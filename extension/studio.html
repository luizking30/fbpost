<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>FB AutoPost — Studio</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body { font: 13px/1.45 -apple-system, "Segoe UI", Roboto, sans-serif;
         background: #0a0c10; color: #e5e7eb; display: flex; }
  iframe { border: 0; flex: 1; height: 100%; }
  aside { width: 340px; border-left: 1px solid #262c3a; background: #12151c;
          display: flex; flex-direction: column; }
  aside header { padding: 10px 14px; border-bottom: 1px solid #262c3a;
                 font-size: 13px; color: #60a5fa; font-weight: 700; }
  aside nav { display: flex; border-bottom: 1px solid #262c3a; }
  aside nav button { flex: 1; padding: 8px; background: none; border: 0;
    color: #9ca3af; font: inherit; font-size: 11px; font-weight: 600;
    cursor: pointer; border-bottom: 2px solid transparent; }
  aside nav button.ativo { color: #60a5fa; border-bottom-color: #3b82f6; }
  aside main { flex: 1; overflow-y: auto; padding: 10px 12px; }
  .pane { display: none; }
  .pane.ativo { display: block; }
  label { display: block; font-size: 11px; color: #9ca3af; margin-bottom: 4px; }
  input[type=text], textarea, select, input[type=file] {
    width: 100%; background: #0d1017; color: #e5e7eb;
    border: 1px solid #2d3442; border-radius: 6px; padding: 7px;
    font: inherit; resize: vertical; margin-bottom: 8px; }
  input:focus, textarea:focus, select:focus { outline: none; border-color: #3b82f6; }
  button.add { width: 100%; padding: 8px; border: 0; border-radius: 6px;
    font: inherit; font-weight: 600; cursor: pointer;
    background: #2563eb; color: #fff; margin-bottom: 12px; }
  button.add:hover { background: #1d4ed8; }
  .item { display: flex; align-items: center; gap: 6px; padding: 7px;
    border: 1px solid #2d3442; border-radius: 6px; margin-bottom: 6px;
    font-size: 12px; }
  .item .info { flex: 1; overflow: hidden; }
  .item .nome { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item small { color: #6b7280; display: block; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; }
  .item .del { background: none; border: 0; color: #f87171; cursor: pointer;
    font-size: 15px; padding: 0 4px; }
  .item .tog { background: none; border: 0; color: #4ade80; cursor: pointer;
    font-size: 12px; padding: 0 4px; }
  .vazio { color: #6b7280; font-size: 11px; padding: 8px 0; }
  #msg { color: #4ade80; font-size: 11px; min-height: 16px; margin-bottom: 6px; }
</style>
</head>
<body>
<iframe src="sidepanel.html" title="FB AutoPost"></iframe>
<aside>
  <header>Biblioteca de conteúdo</header>
  <nav>
    <button class="ativo" data-pane="textos">Textos</button>
    <button data-pane="vars">Variáveis</button>
    <button data-pane="midias">Mídias</button>
  </nav>
  <main>
    <div id="msg"></div>

    <div class="pane ativo" id="p-textos">
      <label>Nome</label>
      <input type="text" id="tNome" placeholder="ex: anuncio marmita v1">
      <label>Conteúdo (use {a|b} e {{var}} — separa variações com ---)</label>
      <textarea id="tConteudo" rows="4"></textarea>
      <button class="add" id="tAdd">Salvar texto</button>
      <div id="tLista"></div>
    </div>

    <div class="pane" id="p-vars">
      <label>Nome da variável (usada como {{nome}})</label>
      <input type="text" id="vNome" placeholder="ex: saudacao">
      <label>Valores separados por |</label>
      <input type="text" id="vValores" placeholder="Olá|Oi|Opa|Fala">
      <button class="add" id="vAdd">Salvar variável</button>
      <div id="vLista"></div>
    </div>

    <div class="pane" id="p-midias">
      <label>Nome</label>
      <input type="text" id="mNome" placeholder="ex: foto anuncio 1">
      <label>Tipo</label>
      <select id="mTipo">
        <option value="imagem">Imagem</option>
        <option value="video">Vídeo</option>
      </select>
      <label>Pasta (opcional — agrupa mídias na lista)</label>
      <input type="text" id="mPasta" placeholder="ex: marmitas">
      <label>Arquivo</label>
      <input type="file" id="mArquivo" accept="image/*,video/*">
      <button class="add" id="mAdd">Salvar mídia</button>
      <div id="mLista"></div>
    </div>
  </main>
</aside>
<script src="biblioteca.js"></script>
<script src="studio.js"></script>
</body>
</html>
